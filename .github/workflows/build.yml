name: Build LeviLab APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q -o "*.zip" -d src
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: 17}
      - run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - run: keytool -genkeypair -keystore src/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: 9.3.1}
      - run: cd src && gradle assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with: {name: LeviLab-apk, path: "src/app/build/outputs/apk/debug/*.apk"}

        
